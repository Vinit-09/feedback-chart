<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Freshdesk Tickets — Month-on-Month</title>
<style>
  :root{
    --page:#f4f4f1; --card:#ffffff; --surface:#ffffff;
    --primary:#0b0b0b; --secondary:#52514e; --muted:#898781;
    --grid:#e1e0d9; --baseline:#c3c2b7; --border:rgba(11,11,11,0.10);
    --accent:#2a78d6; --good:#0a7f0a; --critical:#c0392b; --chip:#f0efec;
    --shadow:0 1px 2px rgba(11,11,11,.05),0 4px 14px rgba(11,11,11,.04);
  }
  body.dark{
    --page:#0d0d0d; --card:#1a1a19; --surface:#1a1a19;
    --primary:#ffffff; --secondary:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,0.10);
    --accent:#3987e5; --good:#0ca30c; --critical:#e06666; --chip:#242422;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--page);color:var(--primary);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.45;transition:background .2s,color .2s}
  .wrap{max-width:1080px;margin:0 auto;padding:18px 18px 44px}
  h1{font-size:19px;margin:0 0 3px;font-weight:700;letter-spacing:-.01em}
  .sub{font-size:12.5px;color:var(--secondary);margin:0 0 14px}

  .bar{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:flex-end;margin-bottom:14px}
  .field{display:flex;flex-direction:column;gap:6px}
  .lab{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .seg{display:inline-flex;flex-wrap:wrap;background:var(--chip);border:1px solid var(--border);border-radius:10px;padding:3px;gap:3px}
  .seg button{border:0;background:transparent;color:var(--secondary);font:inherit;font-size:12.5px;font-weight:600;
    padding:7px 13px;border-radius:7px;cursor:pointer;white-space:nowrap;transition:all .15s}
  .seg button[aria-pressed="true"]{background:var(--surface);color:var(--primary);box-shadow:var(--shadow)}
  select.sel{font:inherit;font-size:13px;font-weight:600;color:var(--primary);background:var(--surface);
    border:1px solid var(--border);border-radius:9px;padding:8px 12px;cursor:pointer;min-width:110px}
  .push{margin-left:auto;display:flex;gap:8px;align-self:flex-end}
  .ghost{border:1px solid var(--border);background:var(--surface);color:var(--secondary);font:inherit;font-size:12.5px;
    font-weight:600;padding:8px 12px;border-radius:9px;cursor:pointer}
  .ghost[aria-pressed="true"]{color:var(--primary);border-color:var(--accent)}

  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px 18px 12px;box-shadow:var(--shadow)}
  .card h2{font-size:15px;margin:0 0 2px;font-weight:700;letter-spacing:-.01em}
  .badge{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
    padding:2px 7px;border-radius:6px;background:var(--chip);color:var(--muted);border:1px solid var(--border);vertical-align:middle;margin-left:8px}
  .cap{font-size:12.5px;color:var(--secondary);margin:2px 0 12px}
  .cap b{color:var(--primary)}
  .win{color:var(--muted);font-weight:600}
  #chart{width:100%;height:420px}

  .drill{margin-top:6px;border-top:1px dashed var(--border);padding-top:12px;font-size:13px;color:var(--secondary)}
  .drill.empty{color:var(--muted);font-style:italic}
  .drill h3{margin:0 0 8px;font-size:13.5px;color:var(--primary)}
  .drill .stats{display:flex;flex-wrap:wrap;gap:8px}
  .drill .st{background:var(--chip);border:1px solid var(--border);border-radius:9px;padding:7px 11px;line-height:1.25}
  .drill .st b{display:block;font-size:16px;color:var(--primary);font-weight:700}
  .drill .st span{font-size:11px;color:var(--muted)}

  .tblwrap{margin-top:14px;overflow-x:auto}
  table.data{width:100%;border-collapse:collapse;font-size:12.5px}
  table.data th,table.data td{padding:7px 12px;border-bottom:1px solid var(--border);text-align:right;font-variant-numeric:tabular-nums}
  table.data th:first-child,table.data td:first-child{text-align:left}
  table.data thead th{color:var(--muted);font-weight:600;background:var(--chip)}
  table.data tr.tot td{font-weight:700}
  .hidden{display:none !important}

  footer.note{margin-top:18px;font-size:11px;color:var(--muted);line-height:1.6}
  footer.note b{color:var(--secondary)}
  #loaderr{padding:36px 6px;color:var(--secondary);font-size:14px}
  @media (max-width:640px){ .push{margin-left:0;width:100%} #chart{height:380px} }
</style>
</head>
<body>
<div class="wrap" id="app">
  <h1>Freshdesk Tickets — Automate &amp; App Automate</h1>
  <p class="sub">Pick a metric and a month — each view shows that month plus the two months before it.</p>

  <div class="bar">
    <div class="field">
      <span class="lab">Metric</span>
      <div class="seg" id="metricSeg" role="group" aria-label="Metric"></div>
    </div>
    <div class="field">
      <span class="lab">Month (+ 2 prior)</span>
      <select class="sel" id="monthSel" aria-label="Anchor month"></select>
    </div>
    <div class="field">
      <span class="lab">Product</span>
      <div class="seg" id="prodSeg" role="group" aria-label="Product">
        <button data-p="All" aria-pressed="true">Both</button>
        <button data-p="Automate" aria-pressed="false">Automate</button>
        <button data-p="App Automate" aria-pressed="false">App Automate</button>
      </div>
    </div>
    <div class="push">
      <button class="ghost" id="tableBtn" aria-pressed="false">▤ Table</button>
      <button class="ghost" id="themeBtn">◐ Theme</button>
    </div>
  </div>

  <div class="card">
    <h2 id="chTitle"></h2>
    <p class="cap" id="chCap"></p>
    <div id="chart"></div>
    <div class="drill empty hidden" id="drill"></div>
    <div class="tblwrap hidden" id="tbl"></div>
  </div>

  <footer class="note" id="foot"></footer>
</div>

<script>
/* ---------- data ---------- */
const DATA = {"months":["2026-04","2026-05","2026-06"],"monthLabels":["Apr","May","Jun"],"products":["Automate","App Automate"],"priorities":["Low","Medium","High","Urgent"],"categories":["Defect/Bug","Configuration & Setup","Flakiness/Reliability","Performance","Feature Request","Learning & Documentation","Account/Billing/Commercial","Usability","Non-actionable","Need to verify"],"resolutions":["Investigation WIP","Pending on Customer","Resolved-Verified","Unspecified","Unverified-Unresponsive","Deferred","Merged-Duplicate"],"cube":{"2026-04":{"Automate":{"total":742,"paid":394,"free":348,"priority":{"Low":346,"Medium":144,"High":168,"Urgent":84},"category":{"Defect/Bug":197,"Configuration & Setup":223,"Flakiness/Reliability":37,"Performance":24,"Feature Request":65,"Learning & Documentation":73,"Account/Billing/Commercial":29,"Usability":14,"Non-actionable":63,"Need to verify":17},"resolution":{"Investigation WIP":200,"Pending on Customer":123,"Resolved-Verified":164,"Unspecified":93,"Unverified-Unresponsive":87,"Deferred":52,"Merged-Duplicate":23}},"App Automate":{"total":695,"paid":532,"free":163,"priority":{"Low":296,"Medium":122,"High":206,"Urgent":71},"category":{"Defect/Bug":203,"Configuration & Setup":171,"Flakiness/Reliability":72,"Performance":23,"Feature Request":47,"Learning & Documentation":68,"Account/Billing/Commercial":17,"Usability":15,"Non-actionable":56,"Need to verify":23},"resolution":{"Investigation WIP":134,"Pending on Customer":163,"Resolved-Verified":158,"Unspecified":66,"Unverified-Unresponsive":118,"Deferred":29,"Merged-Duplicate":27}},"All":{"total":1437,"paid":926,"free":511,"priority":{"Low":642,"Medium":266,"High":374,"Urgent":155},"category":{"Defect/Bug":400,"Configuration & Setup":394,"Flakiness/Reliability":109,"Performance":47,"Feature Request":112,"Learning & Documentation":141,"Account/Billing/Commercial":46,"Usability":29,"Non-actionable":119,"Need to verify":40},"resolution":{"Investigation WIP":334,"Pending on Customer":286,"Resolved-Verified":322,"Unspecified":159,"Unverified-Unresponsive":205,"Deferred":81,"Merged-Duplicate":50}}},"2026-05":{"Automate":{"total":646,"paid":329,"free":317,"priority":{"Low":456,"Medium":83,"High":84,"Urgent":23},"category":{"Defect/Bug":141,"Configuration & Setup":199,"Flakiness/Reliability":51,"Performance":30,"Feature Request":40,"Learning & Documentation":54,"Account/Billing/Commercial":21,"Usability":6,"Non-actionable":86,"Need to verify":18},"resolution":{"Investigation WIP":169,"Pending on Customer":146,"Resolved-Verified":117,"Unspecified":107,"Unverified-Unresponsive":67,"Deferred":25,"Merged-Duplicate":15}},"App Automate":{"total":531,"paid":399,"free":132,"priority":{"Low":362,"Medium":66,"High":81,"Urgent":22},"category":{"Defect/Bug":148,"Configuration & Setup":131,"Flakiness/Reliability":68,"Performance":18,"Feature Request":33,"Learning & Documentation":43,"Account/Billing/Commercial":7,"Usability":9,"Non-actionable":57,"Need to verify":17},"resolution":{"Investigation WIP":105,"Pending on Customer":139,"Resolved-Verified":113,"Unspecified":60,"Unverified-Unresponsive":66,"Deferred":27,"Merged-Duplicate":21}},"All":{"total":1177,"paid":728,"free":449,"priority":{"Low":818,"Medium":149,"High":165,"Urgent":45},"category":{"Defect/Bug":289,"Configuration & Setup":330,"Flakiness/Reliability":119,"Performance":48,"Feature Request":73,"Learning & Documentation":97,"Account/Billing/Commercial":28,"Usability":15,"Non-actionable":143,"Need to verify":35},"resolution":{"Investigation WIP":274,"Pending on Customer":285,"Resolved-Verified":230,"Unspecified":167,"Unverified-Unresponsive":133,"Deferred":52,"Merged-Duplicate":36}}},"2026-06":{"Automate":{"total":767,"paid":396,"free":371,"priority":{"Low":402,"Medium":111,"High":195,"Urgent":59},"category":{"Defect/Bug":253,"Configuration & Setup":198,"Flakiness/Reliability":79,"Performance":27,"Feature Request":36,"Learning & Documentation":38,"Account/Billing/Commercial":43,"Usability":3,"Non-actionable":86,"Need to verify":4},"resolution":{"Investigation WIP":244,"Pending on Customer":205,"Resolved-Verified":128,"Unspecified":118,"Unverified-Unresponsive":31,"Deferred":29,"Merged-Duplicate":12}},"App Automate":{"total":630,"paid":444,"free":186,"priority":{"Low":313,"Medium":91,"High":179,"Urgent":47},"category":{"Defect/Bug":186,"Configuration & Setup":169,"Flakiness/Reliability":66,"Performance":20,"Feature Request":29,"Learning & Documentation":49,"Account/Billing/Commercial":19,"Usability":2,"Non-actionable":85,"Need to verify":5},"resolution":{"Investigation WIP":131,"Pending on Customer":182,"Resolved-Verified":140,"Unspecified":101,"Unverified-Unresponsive":43,"Deferred":23,"Merged-Duplicate":10}},"All":{"total":1397,"paid":840,"free":557,"priority":{"Low":715,"Medium":202,"High":374,"Urgent":106},"category":{"Defect/Bug":439,"Configuration & Setup":367,"Flakiness/Reliability":145,"Performance":47,"Feature Request":65,"Learning & Documentation":87,"Account/Billing/Commercial":62,"Usability":5,"Non-actionable":171,"Need to verify":9},"resolution":{"Investigation WIP":375,"Pending on Customer":387,"Resolved-Verified":268,"Unspecified":219,"Unverified-Unresponsive":74,"Deferred":52,"Merged-Duplicate":22}}}}};
const MG = DATA.months;                 // ['2026-04','2026-05','2026-06']
const MLAB = {}; MG.forEach((m,i)=>MLAB[m]=DATA.monthLabels[i]);
const CATS = DATA.categories, PRIOS = DATA.priorities, RES = DATA.resolutions;
const OPEN_SET = ['Investigation WIP','Pending on Customer'];

const METRICS = [
  {id:'volume',     label:'Volume & split', title:'Ticket volume & product split', badge:'deterministic'},
  {id:'priority',   label:'Priority mix',   title:'Priority mix',                   badge:'deterministic'},
  {id:'paidfree',   label:'Paid vs Free',   title:'Paid vs Free',                   badge:'proxy'},
  {id:'category',   label:'Feedback categories', title:'Feedback categories',       badge:'estimate'},
  {id:'resolution', label:'Resolution status',   title:'Resolution status',         badge:'estimate'}
];

const PAL = {
  light:{ surface:'#ffffff', primary:'#0b0b0b', secondary:'#52514e', muted:'#898781',
    grid:'#e1e0d9', baseline:'#c3c2b7', accent:'#2a78d6',
    product:['#2a78d6','#1baf7a'], priority:['#86b6ef','#5598e7','#2a78d6','#184f95'],
    months:['#86b6ef','#2a78d6','#104281'],
    resolution:['#2a78d6','#1baf7a','#eda100','#008300','#4a3aa7','#e34948','#e87ba4'],
    paidfree:['#2a78d6','#eb6834'] },
  dark:{ surface:'#1a1a19', primary:'#ffffff', secondary:'#c3c2b7', muted:'#898781',
    grid:'#2c2c2a', baseline:'#383835', accent:'#3987e5',
    product:['#3987e5','#199e70'], priority:['#86b6ef','#5598e7','#3987e5','#184f95'],
    months:['#86b6ef','#3987e5','#184f95'],
    resolution:['#3987e5','#199e70','#c98500','#008300','#9085e9','#e66767','#d55181'],
    paidfree:['#3987e5','#d95926'] }
};

const state = { metric:'volume', anchor:MG[MG.length-1], product:'All', dark:false };
let chart=null;
const N = n => n.toLocaleString('en-US');
const P = () => state.dark?PAL.dark:PAL.light;
const B  = (mk, prod) => DATA.cube[mk][prod];
const PB = (mk) => DATA.cube[mk][state.product];
/* window: anchor + up to 2 prior calendar months present in the data (chronological) */
function win(){ const i=MG.indexOf(state.anchor); return MG.slice(Math.max(0,i-2), i+1); }
function prevOf(mk){ const i=MG.indexOf(mk); return i>0?MG[i-1]:null; }

/* ---------- shared ECharts pieces ---------- */
function tooltipBase(){ const p=P(); return { trigger:'axis', confine:true,
  axisPointer:{type:'shadow', shadowStyle:{color: state.dark?'rgba(255,255,255,.05)':'rgba(11,11,11,.04)'}},
  backgroundColor:p.surface, borderColor:'rgba(0,0,0,.08)', borderWidth:1,
  extraCssText:'box-shadow:0 6px 20px rgba(0,0,0,.14);border-radius:10px;', textStyle:{color:p.primary,fontSize:12} }; }
function catAxis(data){ const p=P(); return {type:'category',data,axisLine:{lineStyle:{color:p.baseline}},
  axisTick:{show:false},axisLabel:{color:p.secondary,fontSize:12.5,fontWeight:600}}; }
function valAxis(extra){ const p=P(); return Object.assign({type:'value',axisLine:{show:false},axisTick:{show:false},
  splitLine:{lineStyle:{color:p.grid}},axisLabel:{color:p.muted,fontSize:11}}, extra||{}); }
function legendBase(data,extra){ const p=P(); return Object.assign({data,top:0,right:0,icon:'roundRect',
  itemWidth:11,itemHeight:11,itemGap:12,textStyle:{color:p.secondary,fontSize:11.5},type:'scroll'}, extra||{}); }
function seg(){ const p=P(); return {borderColor:p.surface,borderWidth:2,borderRadius:2}; }
function totalSeries(totals,stackId){ const p=P(); return {name:'__total',type:'bar',stack:stackId,
  data:totals.map(()=>0),silent:true,itemStyle:{color:'transparent',borderWidth:0},tooltip:{show:false},
  label:{show:true,position:'top',distance:6,color:p.primary,fontWeight:700,fontSize:12,
    formatter:pm=>N(totals[pm.dataIndex])},z:5}; }
function gridBase(top){ return {left:6,right:14,top:top||34,bottom:6,containLabel:true}; }

/* ---------- per-metric option builders ---------- */
function optVolume(w){
  const p=P(); const lab=w.map(k=>MLAB[k]); const isAll=state.product==='All';
  const prods=isAll?DATA.products:[state.product];
  const totals=w.map(k=> isAll? B(k,'All').total : B(k,state.product).total);
  const series=prods.map((pr,idx)=>({name:pr,type:'bar',stack:'v',barMaxWidth:96,
    itemStyle:Object.assign({color:p.product[isAll?idx:DATA.products.indexOf(pr)]},seg()),
    label:{show:true,color:'#fff',fontSize:12,fontWeight:600,formatter:pm=>pm.value>45?N(pm.value):''},
    data:w.map(k=>B(k,pr).total)}));
  series.push(totalSeries(totals,'v'));
  return {backgroundColor:'transparent',animationDuration:450,grid:gridBase(),
    legend: isAll?legendBase(prods):{show:false}, xAxis:catAxis(lab), yAxis:valAxis(),
    tooltip:Object.assign(tooltipBase(),{formatter:rows=>{
      let s='<b>'+rows[0].axisValue+' 2026</b>',t=0;
      rows.filter(r=>r.seriesName!=='__total').forEach(r=>{t+=r.value;s+='<br>'+r.marker+r.seriesName+': <b>'+N(r.value)+'</b>';});
      if(isAll) s+='<br><span style="color:'+p.muted+'">Total: <b style="color:'+p.primary+'">'+N(t)+'</b></span>';
      return s;}}), series};
}
function optPriority(w){
  const p=P(); const lab=w.map(k=>MLAB[k]);
  const series=PRIOS.map((lv,idx)=>({name:lv,type:'bar',stack:'pr',barMaxWidth:96,
    itemStyle:Object.assign({color:p.priority[idx]},seg()),
    label:{show:true,color:idx>=2?'#fff':p.primary,fontSize:10.5,fontWeight:600,formatter:pm=>pm.value>42?N(pm.value):''},
    data:w.map(k=>PB(k).priority[lv])}));
  series.push(totalSeries(w.map(k=>PB(k).total),'pr'));
  return {backgroundColor:'transparent',animationDuration:450,grid:gridBase(),
    legend:legendBase(PRIOS), xAxis:catAxis(lab), yAxis:valAxis(),
    tooltip:Object.assign(tooltipBase(),{formatter:rows=>{
      const b=PB(w[rows[0].dataIndex]); const hu=b.priority.High+b.priority.Urgent;
      let s='<b>'+rows[0].axisValue+' 2026</b>';
      rows.filter(r=>r.seriesName!=='__total').forEach(r=>s+='<br>'+r.marker+r.seriesName+': <b>'+N(r.value)+'</b>');
      s+='<br><span style="color:'+p.muted+'">High+Urgent: <b style="color:'+p.primary+'">'+N(hu)+' ('+Math.round(hu/b.total*100)+'%)</b></span>';
      return s;}}), series};
}
function optPaidFree(w){
  const p=P(); const lab=w.map(k=>MLAB[k]); const names=['Paid','Free / unmatched'],keys=['paid','free'];
  const series=keys.map((k,idx)=>({name:names[idx],type:'bar',stack:'pf',barMaxWidth:96,
    itemStyle:Object.assign({color:p.paidfree[idx]},seg()),
    label:{show:true,color:'#fff',fontSize:11.5,fontWeight:600,formatter:pm=>{const b=PB(w[pm.dataIndex]);return Math.round(pm.value/b.total*100)+'%';}},
    data:w.map(mk=>PB(mk)[k])}));
  return {backgroundColor:'transparent',animationDuration:450,grid:gridBase(),
    legend:legendBase(names), xAxis:catAxis(lab), yAxis:valAxis(),
    tooltip:Object.assign(tooltipBase(),{formatter:rows=>{
      const b=PB(w[rows[0].dataIndex]); let s='<b>'+rows[0].axisValue+' 2026</b>';
      rows.forEach(r=>s+='<br>'+r.marker+r.seriesName+': <b>'+N(r.value)+'</b> ('+Math.round(r.value/b.total*100)+'%)');
      return s;}}), series};
}
function optCategories(w){
  const p=P(); const a=state.anchor;
  const order=CATS.slice().sort((x,y)=>B(a,state.product).category[y]-B(a,state.product).category[x]);
  const axisCats=order.slice().reverse();
  const L=w.length;
  const series=w.map((k,i)=>({name:MLAB[k],type:'bar',barGap:'8%',barCategoryGap:'30%',
    itemStyle:{color:p.months[3-L+i],borderRadius:[0,3,3,0]},
    label:{show:true,position:'right',color:p.secondary,fontSize:10,formatter:pm=>pm.value>0?N(pm.value):''},
    data:axisCats.map(c=>B(k,state.product).category[c])}));
  return {backgroundColor:'transparent',animationDuration:450,grid:{left:6,right:38,top:30,bottom:4,containLabel:true},
    legend:legendBase(w.map(k=>MLAB[k])),
    xAxis:valAxis(), yAxis:Object.assign(catAxis(axisCats),{axisLabel:{color:p.secondary,fontSize:11.5,fontWeight:600,width:150,overflow:'truncate'}}),
    tooltip:Object.assign(tooltipBase(),{formatter:rows=>{
      let s='<b>'+rows[0].axisValue+'</b>';
      rows.forEach(r=>s+='<br>'+r.marker+r.seriesName+': <b>'+N(r.value)+'</b>');
      s+='<br><span style="color:'+p.muted+'">click to drill in</span>'; return s;}}),
    series};
}
function optResolution(w){
  const p=P(); const lab=w.map(k=>MLAB[k]);
  const series=RES.map((r,idx)=>({name:r,type:'bar',stack:'rs',barMaxWidth:96,
    itemStyle:Object.assign({color:p.resolution[idx]},seg()), label:{show:false},
    data:w.map(k=>PB(k).resolution[r])}));
  series.push(totalSeries(w.map(k=>PB(k).total),'rs'));
  return {backgroundColor:'transparent',animationDuration:450,grid:gridBase(54),
    legend:legendBase(RES,{width:'94%'}), xAxis:catAxis(lab), yAxis:valAxis(),
    tooltip:Object.assign(tooltipBase(),{formatter:rows=>{
      const b=PB(w[rows[0].dataIndex]); const open=OPEN_SET.reduce((x,k)=>x+b.resolution[k],0);
      let s='<b>'+rows[0].axisValue+' 2026</b>';
      rows.filter(r=>r.seriesName!=='__total').forEach(r=>s+='<br>'+r.marker+r.seriesName+': <b>'+N(r.value)+'</b>');
      s+='<br><span style="color:'+p.muted+'">Still open: <b style="color:'+p.primary+'">'+N(open)+' ('+Math.round(open/b.total*100)+'%)</b></span>';
      return s;}}), series};
}
const BUILD={volume:optVolume,priority:optPriority,paidfree:optPaidFree,category:optCategories,resolution:optResolution};

/* ---------- captions ---------- */
function pp(cur,prev){const d=(cur-prev);return (d>=0?'+':'')+d.toFixed(1)+'pp';}
function caption(w){
  const a=state.anchor, la=MLAB[a], b=PB(a), pv=prevOf(a), bp=pv?PB(pv):null;
  const winTxt='<span class="win">Window: '+w.map(k=>MLAB[k]).join(' · ')+'</span>';
  let s='';
  if(state.metric==='volume'){
    const d= pv? ' ('+(b.total>=B(pv,state.product).total?'+':'')+(((b.total-B(pv,state.product).total)/B(pv,state.product).total)*100).toFixed(1)+'% vs '+MLAB[pv]+')':'';
    s='<b>'+la+': '+N(b.total)+' tickets'+d+'.</b> '+(state.product==='All'?'Automate '+N(B(a,'Automate').total)+' / App Automate '+N(B(a,'App Automate').total)+'. ':'');
  } else if(state.metric==='priority'){
    const hu=b.priority.High+b.priority.Urgent, huShare=Math.round(hu/b.total*100);
    const d= bp? ' ('+pp(hu/b.total*100,(bp.priority.High+bp.priority.Urgent)/bp.total*100)+' vs '+MLAB[pv]+')':'';
    s='<b>'+la+' High+Urgent: '+N(hu)+' ('+huShare+'%)'+d+'.</b> Severity is the line to watch.';
  } else if(state.metric==='paidfree'){
    const sh=Math.round(b.paid/b.total*100);
    const d= bp? ' ('+pp(b.paid/b.total*100, bp.paid/bp.total*100)+' vs '+MLAB[pv]+')':'';
    s='<b>'+la+': '+sh+'% paid'+d+'.</b> Paid = account has purchased parallels (no billing flag in source).';
  } else if(state.metric==='category'){
    const top=CATS.slice().sort((x,y)=>b.category[y]-b.category[x])[0];
    s='<b>'+la+' top category: '+top+' ('+N(b.category[top])+').</b> Bars are '+w.map(k=>MLAB[k]).join(' / ')+' per category — click a bar to drill in.';
  } else if(state.metric==='resolution'){
    const open=OPEN_SET.reduce((x,k)=>x+b.resolution[k],0), sh=Math.round(open/b.total*100);
    const d= bp? ' ('+pp(open/b.total*100, OPEN_SET.reduce((x,k)=>x+bp.resolution[k],0)/bp.total*100)+' vs '+MLAB[pv]+')':'';
    s='<b>'+la+' still-open: '+N(open)+' ('+sh+'%)'+d+'.</b> Investigation WIP + Pending on Customer.';
  }
  return s+' '+winTxt;
}

/* ---------- category drill ---------- */
function drill(cat){
  const el=document.getElementById('drill'); el.classList.remove('empty');
  const w=win();
  const cells=w.map(k=>'<div class="st"><b>'+N(B(k,state.product).category[cat])+'</b><span>'+MLAB[k]+'</span></div>').join('');
  const a=state.anchor, pv=prevOf(a);
  const dTxt= pv? ((B(a,state.product).category[cat]-B(pv,state.product).category[cat])>=0?'+':'')+N(B(a,state.product).category[cat]-B(pv,state.product).category[cat]) : '—';
  const share=(B(a,state.product).category[cat]/B(a,state.product).total*100).toFixed(1);
  el.innerHTML='<h3>'+cat+' — '+(state.product==='All'?'all products':state.product)+'</h3>'+
    '<div class="stats">'+cells+
    '<div class="st"><b>'+dTxt+'</b><span>'+(pv?MLAB[pv]+' → '+MLAB[a]:'MoM')+'</span></div>'+
    '<div class="st"><b>'+share+'%</b><span>of '+MLAB[a]+' volume</span></div>'+
    '<div class="st"><b>'+N(B(a,'Automate').category[cat])+' / '+N(B(a,'App Automate').category[cat])+'</b><span>Automate / App Automate ('+MLAB[a]+')</span></div>'+
    '</div>';
}
function resetDrill(){ const el=document.getElementById('drill'); el.className='drill empty';
  el.textContent='Click a category bar to see its trend and product split.'; }

/* ---------- table (windowed, current metric) ---------- */
function renderTable(){
  const w=win(), el=document.getElementById('tbl');
  const head='<thead><tr><th>'+({volume:'Series',priority:'Priority',paidfree:'Segment',category:'Category',resolution:'Status'}[state.metric])+'</th>'+
    w.map(k=>'<th>'+MLAB[k]+'</th>').join('')+'</tr></thead>';
  let rows=[];
  if(state.metric==='volume'){
    (state.product==='All'?DATA.products:[state.product]).forEach(pr=>rows.push({l:pr,v:w.map(k=>B(k,pr).total)}));
    rows.push({l:'Total',v:w.map(k=>B(k,'All')&&(state.product==='All'?B(k,'All').total:B(k,state.product).total)),tot:1});
  } else if(state.metric==='priority'){
    PRIOS.forEach(lv=>rows.push({l:lv,v:w.map(k=>PB(k).priority[lv])}));
    rows.push({l:'High + Urgent',v:w.map(k=>PB(k).priority.High+PB(k).priority.Urgent),tot:1});
  } else if(state.metric==='paidfree'){
    rows.push({l:'Paid',v:w.map(k=>PB(k).paid)}); rows.push({l:'Free / unmatched',v:w.map(k=>PB(k).free)});
  } else if(state.metric==='category'){
    CATS.forEach(c=>rows.push({l:c,v:w.map(k=>PB(k).category[c])}));
  } else {
    RES.forEach(r=>rows.push({l:r,v:w.map(k=>PB(k).resolution[r])}));
    rows.push({l:'Still open (WIP+Pending)',v:w.map(k=>OPEN_SET.reduce((x,kk)=>x+PB(k).resolution[kk],0)),tot:1});
  }
  el.innerHTML='<table class="data">'+head+'<tbody>'+rows.map(r=>'<tr'+(r.tot?' class="tot"':'')+'><td>'+r.l+'</td>'+r.v.map(x=>'<td>'+N(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table>';
}

/* ---------- render ---------- */
function render(){
  const w=win(), m=METRICS.find(x=>x.id===state.metric);
  document.getElementById('chTitle').innerHTML=m.title+' <span class="badge">'+m.badge+'</span>';
  document.getElementById('chCap').innerHTML=caption(w);
  document.getElementById('chart').style.height=(state.metric==='category'?520:420)+'px';
  chart.resize();
  chart.setOption(BUILD[state.metric](w), true);
  // drill panel only for categories
  const dr=document.getElementById('drill');
  if(state.metric==='category'){ dr.classList.remove('hidden'); resetDrill(); }
  else dr.classList.add('hidden');
  if(!document.getElementById('tbl').classList.contains('hidden')) renderTable();
}

/* ---------- build controls ---------- */
function buildControls(){
  const ms=document.getElementById('metricSeg');
  ms.innerHTML=METRICS.map(m=>'<button data-m="'+m.id+'" aria-pressed="'+(m.id===state.metric)+'">'+m.label+'</button>').join('');
  ms.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
    state.metric=b.dataset.m;[...ms.children].forEach(x=>x.setAttribute('aria-pressed',x===b));render();});
  const sel=document.getElementById('monthSel');
  sel.innerHTML=MG.slice().reverse().map(k=>'<option value="'+k+'"'+(k===state.anchor?' selected':'')+'>'+MLAB[k]+' 2026</option>').join('');
  sel.addEventListener('change',e=>{state.anchor=e.target.value;render();});
  const ps=document.getElementById('prodSeg');
  ps.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
    state.product=b.dataset.p;[...ps.children].forEach(x=>x.setAttribute('aria-pressed',x===b));render();});
  const tb=document.getElementById('tableBtn');
  tb.addEventListener('click',()=>{const t=document.getElementById('tbl');const show=t.classList.contains('hidden');
    t.classList.toggle('hidden',!show);tb.setAttribute('aria-pressed',show);if(show)renderTable();});
  document.getElementById('themeBtn').addEventListener('click',()=>{
    state.dark=!state.dark;document.body.classList.toggle('dark',state.dark);render();});
}

/* ---------- footer ---------- */
function renderFoot(){ document.getElementById('foot').innerHTML=
  '<b>Source:</b> BigQuery <code>cat_dataform.fct_ticket_data</code> (Freshdesk, Automate + App Automate), generated 2026-07-10. '+
  '<b>Deterministic:</b> volume, product split, priority. <b>Estimate (fewshot-v1):</b> feedback categories, resolution status (human-assisted LLM labels — approximate). '+
  '<b>Proxy:</b> Paid = account has purchased parallels. Currently loaded: Apr–Jun 2026; each view shows the chosen month + up to 2 prior months in the data. Internal use.'; }

/* ---------- init ---------- */
function init(){
  state.dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.body.classList.toggle('dark',state.dark);
  chart=echarts.init(document.getElementById('chart'),null,{renderer:'svg'});
  chart.on('click',pm=>{ if(state.metric==='category'&&pm.name) drill(pm.name); });
  buildControls(); renderFoot(); render();
  let rt; window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>chart.resize(),120);});
}
(function(){
  function go(){ if(window.echarts) init(); }
  function add(src,onerr){const s=document.createElement('script');s.src=src;s.onload=go;s.onerror=onerr;document.head.appendChild(s);}
  add('https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js',function(){
    add('https://unpkg.com/echarts@5.5.1/dist/echarts.min.js',function(){
      document.getElementById('app').insertAdjacentHTML('beforeend','<p id="loaderr">Could not load the chart library (network blocked). Reload on a network that allows jsdelivr/unpkg.</p>');});
  });
})();
</script>
</body>
</html>
