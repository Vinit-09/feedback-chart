<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>O11y Dashboard-Migration — Toggle-back Survey</title>
<style>
  :root{
    --page:#f4f4f1; --card:#ffffff; --surface:#ffffff;
    --primary:#0b0b0b; --secondary:#52514e; --muted:#898781;
    --grid:#e1e0d9; --baseline:#c3c2b7; --border:rgba(11,11,11,0.10);
    --accent:#2a78d6; --good:#0a7f0a; --critical:#c0392b; --chip:#f0efec;
    --shadow:0 1px 2px rgba(11,11,11,.05),0 4px 14px rgba(11,11,11,.04);
  }
  body.dark{
    --page:#0d0d0d; --card:#1a1a19; --surface:#1a1a19;
    --primary:#ffffff; --secondary:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --baseline:#383835; --border:rgba(255,255,255,0.10);
    --accent:#3987e5; --good:#0ca30c; --critical:#e06666; --chip:#242422;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--page);color:var(--primary);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.45;transition:background .2s,color .2s}
  .wrap{max-width:1080px;margin:0 auto;padding:18px 18px 44px}
  h1{font-size:19px;margin:0 0 3px;font-weight:700;letter-spacing:-.01em}
  .sub{font-size:12.5px;color:var(--secondary);margin:0 0 14px;max-width:760px}
  .bar{display:flex;flex-wrap:wrap;gap:14px 22px;align-items:flex-end;margin-bottom:14px}
  .field{display:flex;flex-direction:column;gap:6px}
  .lab{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  .seg{display:inline-flex;flex-wrap:wrap;background:var(--chip);border:1px solid var(--border);border-radius:10px;padding:3px;gap:3px}
  .seg button{border:0;background:transparent;color:var(--secondary);font:inherit;font-size:12.5px;font-weight:600;
    padding:7px 13px;border-radius:7px;cursor:pointer;white-space:nowrap;transition:all .15s}
  .seg button[aria-pressed="true"]{background:var(--surface);color:var(--primary);box-shadow:var(--shadow)}
  select.sel{font:inherit;font-size:13px;font-weight:600;color:var(--primary);background:var(--surface);
    border:1px solid var(--border);border-radius:9px;padding:8px 12px;cursor:pointer;min-width:110px}
  .push{margin-left:auto;display:flex;gap:8px;align-self:flex-end}
  .ghost{border:1px solid var(--border);background:var(--surface);color:var(--secondary);font:inherit;font-size:12.5px;
    font-weight:600;padding:8px 12px;border-radius:9px;cursor:pointer}
  .ghost[aria-pressed="true"]{color:var(--primary);border-color:var(--accent)}
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px 18px 12px;box-shadow:var(--shadow)}
  .card h2{font-size:15px;margin:0 0 2px;font-weight:700;letter-spacing:-.01em}
  .badge{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
    padding:2px 7px;border-radius:6px;background:var(--chip);color:var(--muted);border:1px solid var(--border);vertical-align:middle;margin-left:8px}
  .cap{font-size:12.5px;color:var(--secondary);margin:2px 0 12px}
  .cap b{color:var(--primary)}
  .win{color:var(--muted);font-weight:600}
  #chart{width:100%;height:430px}
  .tblwrap{margin-top:14px;overflow-x:auto}
  table.data{width:100%;border-collapse:collapse;font-size:12.5px}
  table.data th,table.data td{padding:7px 12px;border-bottom:1px solid var(--border);text-align:right;font-variant-numeric:tabular-nums}
  table.data th:first-child,table.data td:first-child{text-align:left}
  table.data thead th{color:var(--muted);font-weight:600;background:var(--chip)}
  table.data tr.tot td{font-weight:700}
  .hidden{display:none !important}
  footer.note{margin-top:18px;font-size:11px;color:var(--muted);line-height:1.6}
  footer.note b{color:var(--secondary)}
  #loaderr{padding:36px 6px;color:var(--secondary);font-size:14px}
  @media (max-width:640px){ .push{margin-left:0;width:100%} #chart{height:400px} }
</style>
</head>
<body>
<div class="wrap" id="app">
  <h1>O11y Dashboard-Migration — Toggle-back Survey</h1>
  <p class="sub">In-product survey shown when a user switches from the <strong>new</strong> Test Observability dashboard <strong>back to the old</strong> one. Pick a metric and a month — each view shows that month plus the two months before it.</p>

  <div class="bar">
    <div class="field"><span class="lab">Metric</span><div class="seg" id="metricSeg" role="group" aria-label="Metric"></div></div>
    <div class="field"><span class="lab">Month (+ 2 prior)</span><select class="sel" id="monthSel" aria-label="Anchor month"></select></div>
    <div class="field"><span class="lab">Product</span>
      <div class="seg" id="prodSeg" role="group" aria-label="Product">
        <button data-p="All" aria-pressed="true">Both</button>
        <button data-p="Automate" aria-pressed="false">Automate</button>
        <button data-p="App Automate" aria-pressed="false">App Automate</button>
      </div>
    </div>
    <div class="push">
      <button class="ghost" id="tableBtn" aria-pressed="false">▤ Table</button>
      <button class="ghost" id="themeBtn">◐ Theme</button>
    </div>
  </div>

  <div class="card">
    <h2 id="chTitle"></h2>
    <p class="cap" id="chCap"></p>
    <div id="chart"></div>
    <div class="tblwrap hidden" id="tbl"></div>
  </div>
  <footer class="note" id="foot"></footer>
</div>

const PAL={

let chart=null;
const N=n=>n.toLocaleString('en-US');
const P=()=>state.dark?PAL.dark:PAL.light;
const B=(mk,prod)=>DATA.cube[mk][prod];
const PB=mk=>DATA.cube[mk][state.product];
function win(){const i=MG.indexOf(state.anchor);return MG.slice(Math.max(0,i-2),i+1);}
function prevOf(mk){const i=MG.indexOf(mk);return i>0?MG[i-1]:null;}
function catColor(p,c){return c==='Just Browsing'?p.browsing:(c==='Unspecified'?p.unspec:(p.fric[c]||p.browsing));}

function tooltipBase(){const p=P();return {trigger:'axis',confine:true,

function catAxis(data){const p=P();return {type:'category',data,axisLine:{lineStyle:{color:p.baseline}},axisTick:{show:false},
  axisLabel:{color:p.secondary,fontSize:12.5,fontWeight:600}};}
function valAxis(extra){const p=P();return Object.assign({type:'value',axisLine:{show:false},axisTick:{show:false},

function legendBase(data,extra){const p=P();return Object.assign({data,top:0,right:0,icon:'roundRect',itemWidth:11,itemHeight:11,

function seg(){const p=P();return {borderColor:p.surface,borderWidth:2,borderRadius:2};}
function totalSeries(totals,stackId){const p=P();return {name:'__total',type:'bar',stack:stackId,data:totals.map(()=>0),silent:true,
  itemStyle:{color:'transparent',borderWidth:0},tooltip:{show:false},
  label:{show:true,position:'top',distance:6,color:p.primary,fontWeight:700,fontSize:12,formatter:pm=>N(totals[pm.dataIndex])},z:5};}
function gridB(top){return {left:6,right:14,top:top||34,bottom:6,containLabel:true};}

function optVolume(w){
  const p=P(),lab=w.map(k=>MLAB[k]),isAll=state.product==='All';
  const prods=isAll?DATA.products:[state.product];
  const totals=w.map(k=>PB(k).events);
  const series=prods.map((pr,idx)=>({name:pr,type:'bar',stack:'v',barMaxWidth:90,
    itemStyle:Object.assign({color:p.product[isAll?idx:DATA.products.indexOf(pr)]},seg()),
    label:{show:true,color:'#fff',fontSize:12,fontWeight:600,formatter:pm=>pm.value>80?N(pm.value):''},
    data:w.map(k=>B(k,pr).events)}));
  series.push(totalSeries(totals,'v'));
  return {backgroundColor:'transparent',animationDuration:450,grid:gridB(),legend:isAll?legendBase(prods):{show:false},
    xAxis:catAxis(lab),yAxis:valAxis(),
    tooltip:Object.assign(tooltipBase(),{formatter:rows=>{const b=PB(w[rows[0].dataIndex]);let s='<b>'+rows[0].axisValue+' 2026</b>',t=0;
      rows.filter(r=>r.seriesName!=='__total').forEach(r=>{t+=r.value;s+='<br>'+r.marker+r.seriesName+': <b>'+N(r.value)+'</b> ('+Math.round(r.value/b.events*100)+'%)';});
      s+='<br><span style="color:'+p.muted+'">Total: <b style="color:'+p.primary+'">'+N(b.events)+'</b> · '+N(b.users)+' users</span>';return s;}}),series};
}
function stackByKeys(w,keys,colorFn,stackId){
  return keys.map(key=>({name:key,type:'bar',stack:stackId,barMaxWidth:90,
    itemStyle:Object.assign({color:colorFn(key)},seg()),label:{show:false},
    data:w.map(k=>PB(k)[stackId==='mix'?'category':(stackId==='fr'?'category':'plan')][key])}));
}
function optMix(w){
  const p=P(),lab=w.map(k=>MLAB[k]);
  const series=CATS.map(c=>({name:c,type:'bar',stack:'mx',barMaxWidth:90,
    itemStyle:Object.assign({color:catColor(p,c)},seg()),label:{show:true,color:'#fff',fontSize:10,fontWeight:600,formatter:pm=>{const t=PB(w[pm.dataIndex]).events;return pm.value/t>=0.08?Math.round(pm.value/t*100)+'%':'';}},data:w.map(k=>PB(k).category[c])}));
  series.push(totalSeries(w.map(k=>PB(k).events),'mx'));
  return {backgroundColor:'transparent',animationDuration:450,grid:gridB(52),legend:legendBase(CATS,{width:'94%'}),
    xAxis:catAxis(lab),yAxis:valAxis(),
    tooltip:Object.assign(tooltipBase(),{formatter:rows=>{const b=PB(w[rows[0].dataIndex]);
      const fr=FRICTION.reduce((a,c)=>a+b.category[c],0);let s='<b>'+rows[0].axisValue+' 2026</b>';
      rows.filter(r=>r.seriesName!=='__total').forEach(r=>{if(r.value>0)s+='<br>'+r.marker+r.seriesName+': <b>'+N(r.value)+'</b> ('+Math.round(r.value/b.events*100)+'%)';});
      s+='<br><span style="color:'+p.muted+'">Structured friction: <b style="color:'+p.primary+'">'+N(fr)+' ('+Math.round(fr/b.events*100)+'%)</b></span>';return s;}}),series};
}
function optFriction(w){
  const p=P(),lab=w.map(k=>MLAB[k]);
  const series=FRICTION.map(c=>({name:c,type:'bar',stack:'fr',barMaxWidth:90,
    itemStyle:Object.assign({color:p.fric[c]},seg()),
    label:{show:true,color:'#fff',fontSize:10.5,fontWeight:600,formatter:pm=>pm.value>45?N(pm.value):''},
    data:w.map(k=>PB(k).category[c])}));
  series.push(totalSeries(w.map(k=>FRICTION.reduce((a,c)=>a+PB(k).category[c],0)),'fr'));
  return {backgroundColor:'transparent',animationDuration:450,grid:gridB(34),legend:legendBase(FRICTION,{width:'94%'}),
    xAxis:catAxis(lab),yAxis:valAxis(),
    tooltip:Object.assign(tooltipBase(),{formatter:rows=>{const b=PB(w[rows[0].dataIndex]);const ft=FRICTION.reduce((a,c)=>a+b.category[c],0)||1;let s='<b>'+rows[0].axisValue+' 2026 — friction</b>';
      rows.filter(r=>r.seriesName!=='__total').forEach(r=>s+='<br>'+r.marker+r.seriesName+': <b>'+N(r.value)+'</b> ('+Math.round(r.value/ft*100)+'%)');return s;}}),series};
}
function optPlan(w){
  const p=P(),lab=w.map(k=>MLAB[k]);
  const series=PLANS.map(pl=>({name:pl,type:'bar',stack:'pl',barMaxWidth:90,
    itemStyle:Object.assign({color:p.plan[pl]},seg()),
    label:{show:true,color:'#fff',fontSize:11,fontWeight:600,formatter:pm=>pm.value>120?N(pm.value):''},
    data:w.map(k=>PB(k).plan[pl])}));
  return {backgroundColor:'transparent',animationDuration:450,grid:gridB(),legend:legendBase(PLANS),
    xAxis:catAxis(lab),yAxis:valAxis(),
    tooltip:Object.assign(tooltipBase(),{formatter:rows=>{const b=PB(w[rows[0].dataIndex]);const t=PLANS.reduce((a,x)=>a+b.plan[x],0)||1;
      let s='<b>'+rows[0].axisValue+' 2026</b>';rows.forEach(r=>s+='<br>'+r.marker+r.seriesName+': <b>'+N(r.value)+'</b> ('+Math.round(r.value/t*100)+'%)');return s;}}),series};
}
function optReasons(){
  const p=P(),b=PB(state.anchor);
  const items=REASONS.map(r=>[r,b.reason[r]||0]).filter(x=>x[1]>0).sort((a,c)=>a[1]-c[1]);
  const top=items.slice(-15);                       // top 15 ascending (largest at top)
  const cats=FRICTION.filter(c=>top.some(t=>RCAT[t[0]]===c));
  const series=cats.map(c=>({name:c,type:'bar',stack:'r',barMaxWidth:16,
    itemStyle:{color:p.fric[c],borderRadius:[0,3,3,0]},
    label:{show:true,position:'right',color:p.secondary,fontSize:10,formatter:pm=>pm.value>0?N(pm.value):''},
    data:top.map(t=>RCAT[t[0]]===c?t[1]:'-')}));
  return {backgroundColor:'transparent',animationDuration:450,grid:{left:6,right:40,top:30,bottom:4,containLabel:true},
    legend:legendBase(cats),
    xAxis:valAxis(),
    yAxis:Object.assign(catAxis(top.map(t=>t[0])),{axisLabel:{color:p.secondary,fontSize:11,width:230,overflow:'truncate'}}),
    tooltip:Object.assign(tooltipBase(),{formatter:rows=>{const r=rows.find(x=>x.value!=='-'&&x.value>0)||rows[0];const ct=b.category[RCAT[r.axisValue]]||0;
      return '<b>'+r.axisValue+'</b><br>'+r.marker+r.seriesName+': <b>'+N(r.value)+'</b>'+(ct?' ('+Math.round(r.value/ct*100)+'% of '+RCAT[r.axisValue]+')':'');}}),series};
}
const BUILD={volume:optVolume,mix:optMix,friction:optFriction,plan:optPlan,reasons:optReasons};

function pct(n,d){return d?Math.round(n/d*100):0;}
function caption(w){
  const a=state.anchor,la=MLAB[a],b=PB(a),pv=prevOf(a),bp=pv?PB(pv):null;
  const winTxt='<span class="win">Window: '+w.map(k=>MLAB[k]).join(' · ')+'</span>';
  let s='';
  if(state.metric==='volume'){
    const d=bp?' ('+(b.events>=bp.events?'+':'')+(((b.events-bp.events)/bp.events)*100).toFixed(1)+'% vs '+MLAB[pv]+')':'';
    s='<b>'+la+': '+N(b.events)+' toggle-backs'+d+' · '+N(b.users)+' distinct users.</b> '+
      (state.product==='All'?'App Automate '+N(B(a,'App Automate').events)+' / Automate '+N(B(a,'Automate').events)+'.':'');
  } else if(state.metric==='mix'){
    const fr=FRICTION.reduce((x,c)=>x+b.category[c],0),sh=pct(fr,b.events);
    const d=bp?' (was '+pct(FRICTION.reduce((x,c)=>x+bp.category[c],0),bp.events)+'% in '+MLAB[pv]+')':'';
    s='<b>'+la+' structured friction: '+sh+'% ('+N(fr)+' of '+N(b.events)+')'+d+'.</b> The rest is "Just Browsing" (exploration).';
  } else if(state.metric==='friction'){
    const fr=FRICTION.reduce((x,c)=>x+b.category[c],0);
    const topc=FRICTION.slice().sort((x,y)=>b.category[y]-b.category[x])[0];
    s='<b>'+la+' friction events: '+N(fr)+'.</b> '+topc+' leads ('+N(b.category[topc])+'). Excludes "Just Browsing".';
  } else if(state.metric==='plan'){
    const t=PLANS.reduce((x,p2)=>x+b.plan[p2],0);
    s='<b>'+la+': '+PLANS.map(p2=>p2.replace('Extended Free Trial','EFT')+' '+N(b.plan[p2])).join(' · ')+'.</b> Share of '+N(t)+' plan-tagged events.';
  } else if(state.metric==='reasons'){
    const items=REASONS.map(r=>[r,b.reason[r]||0]).filter(x=>x[1]>0).sort((a2,c2)=>c2[1]-a2[1]);
    const top=items[0];
    s='<b>'+la+' top friction driver: '+(top?top[0]+' ('+N(top[1])+')':'—')+'.</b> Predefined survey reasons within friction categories; "Other/free-text" excluded. <em>Anchor month only.</em>';
    return s+' '+winTxt.replace('Window','Anchor');
  }
  return s+' '+winTxt;
}

function renderTable(){
  const w=win(),el=document.getElementById('tbl');
  const head=m=>'<thead><tr><th>'+m+'</th>'+w.map(k=>'<th>'+MLAB[k]+'</th>').join('')+'</tr></thead>';
  let rows=[],lbl='';
  if(state.metric==='volume'){lbl='Series';
    (state.product==='All'?DATA.products:[state.product]).forEach(pr=>rows.push({l:pr,v:w.map(k=>B(k,pr).events)}));
    rows.push({l:'Total events',v:w.map(k=>PB(k).events),tot:1});
    rows.push({l:'Distinct users',v:w.map(k=>PB(k).users),tot:1});
  } else if(state.metric==='mix'){lbl='Category';CATS.forEach(c=>rows.push({l:c,v:w.map(k=>PB(k).category[c])}));
    rows.push({l:'Friction total',v:w.map(k=>FRICTION.reduce((a,c)=>a+PB(k).category[c],0)),tot:1});
  } else if(state.metric==='friction'){lbl='Friction category';FRICTION.forEach(c=>rows.push({l:c,v:w.map(k=>PB(k).category[c])}));
  } else if(state.metric==='plan'){lbl='Plan';PLANS.forEach(pl=>rows.push({l:pl,v:w.map(k=>PB(k).plan[pl])}));
  } else {lbl='Reason ('+MLAB[state.anchor]+')';
    const b=PB(state.anchor);const items=REASONS.map(r=>[r,b.reason[r]||0]).filter(x=>x[1]>0).sort((a,c)=>c[1]-a[1]);
    el.innerHTML='<table class="data"><thead><tr><th>Reason</th><th>Category</th><th>'+MLAB[state.anchor]+'</th></tr></thead><tbody>'+
      items.map(t=>{const ct=b.category[RCAT[t[0]]]||0;return '<tr><td>'+t[0]+'</td><td style="text-align:left">'+RCAT[t[0]]+'</td><td>'+N(t[1])+(ct?' <span style="color:var(--muted);font-weight:400">('+Math.round(t[1]/ct*100)+'%)</span>':'')+'</td></tr>';}).join('')+'</tbody></table>';return;}
  const colTot=w.map(k=>state.metric==='friction'?FRICTION.reduce((a,c)=>a+PB(k).category[c],0):(state.metric==='plan'?PLANS.reduce((a,x)=>a+PB(k).plan[x],0):PB(k).events));
  el.innerHTML='<table class="data">'+head(lbl)+'<tbody>'+rows.map(r=>'<tr'+(r.tot?' class="tot"':'')+'><td>'+r.l+'</td>'+r.v.map((x,ci)=>'<td>'+N(x)+(!r.tot&&colTot[ci]?' <span style="color:var(--muted);font-weight:400">('+Math.round(x/colTot[ci]*100)+'%)</span>':'')+'</td>').join('')+'</tr>').join('')+'</tbody></table>';
}

function render(){
  const w=win(),m=METRICS.find(x=>x.id===state.metric);
  document.getElementById('chTitle').innerHTML=m.title+' <span class="badge">'+m.badge+'</span>';
  document.getElementById('chCap').innerHTML=caption(w);
  document.getElementById('chart').style.height=(state.metric==='reasons'?470:430)+'px';
  chart.resize();
  chart.setOption(BUILD[state.metric](w),true);
  if(!document.getElementById('tbl').classList.contains('hidden'))renderTable();
}
function buildControls(){
  const ms=document.getElementById('metricSeg');
  ms.innerHTML=METRICS.map(m=>'<button data-m="'+m.id+'" aria-pressed="'+(m.id===state.metric)+'">'+m.label+'</button>').join('');
  ms.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;state.metric=b.dataset.m;
    [...ms.children].forEach(x=>x.setAttribute('aria-pressed',x===b));render();});
  const sel=document.getElementById('monthSel');
  sel.innerHTML=MG.slice().reverse().map(k=>'<option value="'+k+'"'+(k===state.anchor?' selected':'')+'>'+MLAB[k]+' 2026</option>').join('');
  sel.addEventListener('change',e=>{state.anchor=e.target.value;render();});
  const ps=document.getElementById('prodSeg');
  ps.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;state.product=b.dataset.p;
    [...ps.children].forEach(x=>x.setAttribute('aria-pressed',x===b));render();});
  const tb=document.getElementById('tableBtn');
  tb.addEventListener('click',()=>{const t=document.getElementById('tbl');const show=t.classList.contains('hidden');
    t.classList.toggle('hidden',!show);tb.setAttribute('aria-pressed',show);if(show)renderTable();});
  document.getElementById('themeBtn').addEventListener('click',()=>{state.dark=!state.dark;document.body.classList.toggle('dark',state.dark);render();});
}
function renderFoot(){document.getElementById('foot').innerHTML=
  '<b>Source:</b> in-product survey event <code>O11yToExistingDashboardToggleFeedback</code> (BigQuery), Mar–Jun 2026. '+
  'Event/user counts and the structured category/reason/plan breakdowns are deterministic survey fields. '+
  '"Top friction reasons" are the survey’s predefined reason options (free-text "Other" excluded). '+
  'Each view shows the chosen month + up to 2 prior. Aggregate only — no customer PII.';}
function init(){
  state.dark=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.body.classList.toggle('dark',state.dark);
  chart=echarts.init(document.getElementById('chart'),null,{renderer:'svg'});
  buildControls();renderFoot();render();
  let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>chart.resize(),120);});
}
(function(){function go(){if(window.echarts)init();}
  function add(src,onerr){const s=document.createElement('script');s.src=src;s.onload=go;s.onerror=onerr;document.head.appendChild(s);}
  add('https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js',function(){
    add('https://unpkg.com/echarts@5.5.1/dist/echarts.min.js',function(){
      document.getElementById('app').insertAdjacentHTML('beforeend','<p id="loaderr">Could not load the chart library (network blocked). Reload on a network that allows jsdelivr/unpkg.</p>');});});
})();
</script>
</body>
</html>
